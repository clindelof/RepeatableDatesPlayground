name: Bug report
description: Report reproducible playground behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Synthetic configuration
      description: Include a minimal, non-sensitive configuration or reproduction.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
    validations:
      required: true
